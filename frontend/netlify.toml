# Place this at the root of the FRONTEND repo/folder (where index.html and
# harmony-calendar-helper.html live), not the backend.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Real protection on the Schedule Helper is the shared ADMIN_PASSCODE
# checked server-side on every request (see requireAdminPasscode.js). This
# header just keeps the page out of search engine indexes — it's not
# security on its own.
[[headers]]
  for = "/harmony-calendar-helper.html"
  [headers.values]
    X-Robots-Tag = "noindex"
