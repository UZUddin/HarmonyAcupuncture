<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1e1a14; --cream: #faf6ef; --cream-mid: #f2ebe0; --cream-dark: #e8dfd0;
  --sage: #3d6035; --sage-dark: #274020; --sage-light: #e4ede0;
  --red: #a03030; --text-muted: #6a5e50; --border: rgba(80,60,30,0.16);
}
body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); font-size: 16px; line-height: 1.5; padding: 1.5rem; -webkit-font-smoothing: antialiased; }
body.zh { font-family: 'Noto Serif SC', 'Inter', serif; }
body.zh .zh-show { display: inline; } body.zh .en-show { display: none; }
body:not(.zh) .zh-show { display: none; } body:not(.zh) .en-show { display: inline; }
 
.wrap { max-width: 640px; margin: 0 auto; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
h1 { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500; }
.lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; background: #fff; }
.lang-btn { padding: 7px 14px; font-size: 13px; border: none; background: none; cursor: pointer; color: var(--text-muted); }
.lang-btn.active { background: var(--sage); color: #fff; font-weight: 600; }
 
/* PASSCODE SCREEN */
#passcode-screen { max-width: 380px; margin: 4rem auto; text-align: center; }
#passcode-screen p { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 15px; }
#passcode-input { width: 100%; padding: 16px; font-size: 20px; text-align: center; border: 2px solid var(--border); border-radius: 8px; margin-bottom: 1rem; letter-spacing: 0.05em; }
#passcode-error { color: var(--red); font-size: 14px; margin-top: 10px; min-height: 20px; }
.status-msg { color: var(--text-muted); font-size: 14px; margin-top: 10px; min-height: 20px; }
.big-btn { width: 100%; padding: 16px; font-size: 17px; font-weight: 600; border-radius: 8px; border: none; background: var(--sage); color: #fff; cursor: pointer; }
.big-btn:hover { background: var(--sage-dark); }
 
#dashboard { display: none; }
.week-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 10px; }
.week-nav button { padding: 12px 18px; font-size: 15px; font-weight: 500; border: 2px solid var(--border); background: #fff; border-radius: 8px; cursor: pointer; }
.week-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
 
.day-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
.day-header { padding: 14px 18px; background: var(--cream-mid); display: flex; justify-content: space-between; align-items: baseline; }

.event-row:last-of-type { border-bottom: none; }

.no-events { font-size: 14px; color: var(--text-muted); padding: 6px 0; }
.closed-note { font-size: 14px; color: var(--text-muted); font-style: italic; padding: 6px 0; }
 
.add-block-btn { width: 100%; padding: 12px; margin-top: 10px; font-size: 14px; font-weight: 600; color: var(--sage-dark); background: var(--sage-light); border: none; border-radius: 8px; cursor: pointer; }
.add-block-btn.open-btn { color: #8a5a00; background: #fff3d6; }
.add-block-form { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
.add-block-form.open { display: block; }
.form-row-inline { display: flex; gap: 10px; margin-bottom: 10px; }
.form-row-inline > div { flex: 1; }
.add-block-form label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.add-block-form select, .add-block-form input { width: 100%; padding: 10px; font-size: 15px; border: 1.5px solid var(--border); border-radius: 6px; }
.save-block-btn { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; background: var(--sage); color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-top: 4px; }
.form-error { color: var(--red); font-size: 13px; margin-top: 6px; }
</style>

<body>
<div class="wrap">
  <div class="top-bar">
    <h1><span class="en-show">Schedule Helper</span><span class="zh-show">日程助手</span></h1>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="btn-zh" onclick="setLang('zh')">中文</button>
    </div>
  </div>
 
  <div id="passcode-screen">
    <p><span class="en-show">Enter your passcode to manage your schedule.</span><span class="zh-show">请输入密码以管理您的日程。</span></p>
    <input type="password" id="passcode-input" inputmode="text" />
    <button class="big-btn" id="enter-btn" onclick="checkPasscode()"><span class="en-show">Enter</span><span class="zh-show">进入</span></button>
    <p id="passcode-status" class="status-msg"></p>
    <p id="passcode-error"></p>
  </div>
 
  <div id="dashboard">
    <div class="week-nav">
      <button id="prev-week-btn" onclick="shiftWeek(-1)">← <span class="en-show">Back</span><span class="zh-show">上一周</span></button>
      <button onclick="shiftWeek(0, true)"><span class="en-show">This Week</span><span class="zh-show">本周</span></button>
      <button onclick="shiftWeek(1)"><span class="en-show">Next</span><span class="zh-show">下一周</span> →</button>
    </div>
    <div id="days-container"></div>
  </div>
</div>
 
<script>
// TODO: replace with your real Render URL once deployed
const API_BASE = 'https://harmonyacupuncture.onrender.com';
let passcode = localStorage.getItem('harmony_admin_passcode') || '';
 
// Patient-submitted text (like their name, which becomes the calendar
// event summary) is untrusted and can contain HTML/script. Anything from
// the API that gets inserted via innerHTML MUST go through this first, or
// a malicious booking name could run script in this page — which has
// access to the admin passcode in localStorage.
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str ?? '');
  return div.innerHTML;
}
let weekOffset = 0; // weeks from the current week (0 = this week, -1 = last week, etc.)
 
// Guards against the auto-login (fires on page load using a cached
// passcode) and a manual submit racing each other — especially once Render's
// free-tier backend is cold and a request can take 20-50+ seconds. Whichever
// attempt is LATEST wins; a slow, stale response is ignored instead of
// silently flipping the screen to "logged in".
let authAttemptId = 0;
 
function isZh() { return document.body.classList.contains('zh'); }
 
function setLang(lang) {
  document.body.classList.toggle('zh', lang === 'zh');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
  if (document.getElementById('dashboard').style.display === 'block') renderWeek();
}
 
function showDashboard() {
  document.getElementById('passcode-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  renderWeek();
}
 
async function checkPasscode() {
  const input = document.getElementById('passcode-input').value.trim();
  const errorEl = document.getElementById('passcode-error');
  const statusEl = document.getElementById('passcode-status');
  const enterBtn = document.getElementById('enter-btn');
  const myAttempt = ++authAttemptId; // supersedes any in-flight auto-login or earlier submit
  errorEl.textContent = '';
  statusEl.textContent = isZh() ? '正在检查密码…' : 'Checking passcode…';
  enterBtn.disabled = true;
  enterBtn.textContent = isZh() ? '正在检查…' : 'Checking…';
 
  try {
    const res = await fetch(`${API_BASE}/api/admin/verify`, { headers: { 'X-Admin-Passcode': input } });
    if (myAttempt !== authAttemptId) return; // a newer attempt has already taken over
 
    if (!res.ok) {
      statusEl.textContent = '';
      errorEl.textContent = isZh() ? '密码错误，请重试。' : 'Incorrect passcode — please try again.';
      return;
    }
    statusEl.textContent = isZh() ? '密码正确 ✓' : 'Passcode correct ✓';
    passcode = input;
    localStorage.setItem('harmony_admin_passcode', passcode);
    showDashboard();
  } catch (err) {
    if (myAttempt !== authAttemptId) return;
    statusEl.textContent = '';
    errorEl.textContent = isZh() ? '网络错误，请重试。' : 'Network error — please try again.';
  } finally {
    if (myAttempt === authAttemptId) {
      enterBtn.disabled = false;
      enterBtn.innerHTML = '<span class="en-show">Enter</span><span class="zh-show">进入</span>';
    }
  }
}
 
// Auto-login if a passcode was saved from a previous visit. If it turns out
// to be wrong (e.g. it was rotated), clear it immediately instead of
// leaving a dead passcode in localStorage that keeps quietly re-trying —
// and never let this overwrite a manual attempt that's already in progress.
window.addEventListener('DOMContentLoaded', async () => {
  if (!passcode) return;
  const myAttempt = ++authAttemptId;
  const statusEl = document.getElementById('passcode-status');
  statusEl.textContent = isZh() ? '正在使用已保存的密码…' : 'Checking saved passcode…';
  try {
    const res = await fetch(`${API_BASE}/api/admin/verify`, { headers: { 'X-Admin-Passcode': passcode } });
    if (myAttempt !== authAttemptId) return;
    if (res.ok) {
      statusEl.textContent = isZh() ? '密码正确 ✓' : 'Passcode correct ✓';
      showDashboard();
    } else {
      localStorage.removeItem('harmony_admin_passcode');
      passcode = '';
      statusEl.textContent = isZh() ? '已保存的密码已失效，请重新输入。' : 'Saved passcode no longer works — please enter it again.';
    }
  } catch (err) {
    if (myAttempt !== authAttemptId) return;
    statusEl.textContent = ''; // network hiccup on the silent auto-login — stay on passcode screen, don't clear it
  }
});
 
// weekOffset counts whole WEEKS from the current week, not days from today —
// this lets the grid always start on Monday and lets her page back through
// past weeks (e.g. to check a past booking), not just forward.
function shiftWeek(weeks, resetToToday) {
  weekOffset = resetToToday ? 0 : weekOffset + weeks;
  renderWeek();
}
 
// Monday of (this week + offset weeks), at local midnight.
function getWeekStart(offset) {
  const d = new Date();
  const day = d.getDay(); // 0 = Sunday ... 6 = Saturday
  const diffToMonday = day === 0 ? -6 : 1 - day;
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + diffToMonday + offset * 7);
  return d;
}
 
function fmtDate(d) { return d.toISOString().split('T')[0]; }
 
async function renderWeek() {
  const container = document.getElementById('days-container');
  container.innerHTML = '';
  const weekStart = getWeekStart(weekOffset);
 
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    const dateStr = fmtDate(d);
    const dayLabel = d.toLocaleDateString(isZh() ? 'zh-CN' : 'en-US', { weekday: 'long', month: 'short', day: 'numeric' });
 
    const card = document.createElement('div');
    card.className = 'day-card';
    card.innerHTML = `
      <div class="day-header">
        <span class="day-name">${dayLabel}</span>
        <span class="day-hours" id="hours-${dateStr}">…</span>
      </div>
      <div class="day-body" id="body-${dateStr}">
        <p class="no-events">${isZh() ? '加载中…' : 'Loading…'}</p>
      </div>`;
    container.appendChild(card);
    loadDay(dateStr);
  }
}
 
async function loadDay(dateStr) {
  const bodyEl = document.getElementById(`body-${dateStr}`);
  const hoursEl = document.getElementById(`hours-${dateStr}`);
 
  try {
    const res = await fetch(`${API_BASE}/api/admin/day?date=${dateStr}`, { headers: { 'X-Admin-Passcode': passcode } });
    const data = await res.json();
 
    if (!data.openWindows || data.openWindows.length === 0) {
      hoursEl.textContent = isZh() ? '未开放' : 'Not open yet';
    } else {
      hoursEl.textContent = data.openWindows
        .map((w) => {
          const s = new Date(w.start).toLocaleTimeString(isZh() ? 'zh-CN' : 'en-US', { hour: 'numeric', minute: '2-digit' });
          const e = new Date(w.end).toLocaleTimeString(isZh() ? 'zh-CN' : 'en-US', { hour: 'numeric', minute: '2-digit' });
          return `${s} – ${e}`;
        })
        .join(', ');
    }
 
    let html = '';
    if (!data.events || data.events.length === 0) {
      html += `<p class="no-events">${isZh() ? '当天没有安排。' : 'Nothing scheduled.'}</p>`;
    } else {
      data.events.forEach((ev) => {
        const start = new Date(ev.start).toLocaleTimeString(isZh() ? 'zh-CN' : 'en-US', { hour: 'numeric', minute: '2-digit' });
        const end = new Date(ev.end).toLocaleTimeString(isZh() ? 'zh-CN' : 'en-US', { hour: 'numeric', minute: '2-digit' });
        const tag = ev.isPatientBooking
          ? `<span class="event-tag">${isZh() ? '患者预约' : 'Patient'}</span>`
          : ev.isOpenOverride
          ? `<span class="event-tag open-tag">${isZh() ? '可预约时间' : 'Open'}</span>`
          : '';
        let actionBtns = '';
        if (ev.isPatientBooking) {
          actionBtns = `
            <button class="delete-btn" style="width:auto;padding:0 10px;font-size:13px;" onclick="toggleRescheduleForm('${ev.id}','${dateStr}')">${isZh() ? '改期' : 'Reschedule'}</button>
            <button class="delete-btn" style="width:auto;padding:0 10px;font-size:13px;" onclick="cancelAppointment('${ev.id}','${dateStr}')">${isZh() ? '取消' : 'Cancel'}</button>`;
        } else {
          actionBtns = `<button class="delete-btn" onclick="deleteBlock('${ev.id}','${dateStr}')" aria-label="Delete">✕</button>`;
        }
        html += `<div class="event-row">
          <div><span class="event-time">${start} – ${end}</span><span class="event-label">${escapeHtml(ev.summary)}</span>${tag}</div>
          <div style="display:flex;gap:6px;">${actionBtns}</div>
        </div>`;
        if (ev.isPatientBooking) {
          html += `<div class="add-block-form" id="reschedule-${ev.id}">
            <label>${isZh() ? '新日期' : 'New date'}</label>
            <input type="date" id="reschedule-date-${ev.id}" value="${dateStr}" />
            <div class="form-row-inline" style="margin-top:10px;">
              <div><label>${isZh() ? '开始时间' : 'Start'}</label>${buildTimeSelect(`reschedule-start-${ev.id}`)}</div>
              <div><label>${isZh() ? '结束时间' : 'End'}</label>${buildTimeSelect(`reschedule-end-${ev.id}`)}</div>
            </div>
            <button class="save-block-btn" onclick="saveReschedule('${ev.id}','${dateStr}')">${isZh() ? '保存新时间' : 'Save new time'}</button>
            <p class="form-error" id="reschedule-error-${ev.id}"></p>
          </div>`;
        }
      });
    }
 
    {
      html += `<button class="add-block-btn" onclick="toggleAddForm('${dateStr}')">+ ${isZh() ? '添加不可预约时间' : 'Add busy time'}</button>
        <div class="add-block-form" id="form-${dateStr}">
          <div class="form-row-inline">
            <div><label>${isZh() ? '开始时间' : 'Start'}</label>${buildTimeSelect(`start-${dateStr}`)}</div>
            <div><label>${isZh() ? '结束时间' : 'End'}</label>${buildTimeSelect(`end-${dateStr}`)}</div>
          </div>
          <label>${isZh() ? '备注（选填）' : 'Label (optional)'}</label>
          <input type="text" id="label-${dateStr}" placeholder="${isZh() ? '例如：午餐' : 'e.g. Lunch'}" />
          <button class="save-block-btn" onclick="saveBlock('${dateStr}')">${isZh() ? '保存' : 'Save'}</button>
          <p class="form-error" id="error-${dateStr}"></p>
        </div>
        <button class="add-block-btn open-btn" onclick="toggleOpenForm('${dateStr}')">+ ${isZh() ? '添加可预约时间' : 'Add free time'}</button>
        <div class="add-block-form" id="open-form-${dateStr}">
          <div class="form-row-inline">
            <div><label>${isZh() ? '开始时间' : 'Start'}</label>${buildTimeSelect(`open-start-${dateStr}`)}</div>
            <div><label>${isZh() ? '结束时间' : 'End'}</label>${buildTimeSelect(`open-end-${dateStr}`)}</div>
          </div>
          <label>${isZh() ? '备注（选填）' : 'Label (optional)'}</label>
          <input type="text" id="open-label-${dateStr}" placeholder="${isZh() ? '例如：特别开放' : 'e.g. Special hours'}" />
          <button class="save-block-btn" onclick="saveOpenTime('${dateStr}')">${isZh() ? '保存' : 'Save'}</button>
          <p class="form-error" id="open-error-${dateStr}"></p>
        </div>`;
    }
 
    bodyEl.innerHTML = html;
  } catch (err) {
    bodyEl.innerHTML = `<p class="no-events" style="color:var(--red);">${isZh() ? '加载失败。' : 'Failed to load.'}</p>`;
  }
}
 
function buildTimeSelect(id) {
  let options = '';
  for (let h = 7; h <= 20; h++) {
    for (let m = 0; m < 60; m += 30) {
      const hh = String(h).padStart(2, '0');
      const mm = String(m).padStart(2, '0');
      const label = new Date(`2000-01-01T${hh}:${mm}`).toLocaleTimeString(isZh() ? 'zh-CN' : 'en-US', { hour: 'numeric', minute: '2-digit' });
      options += `<option value="${hh}:${mm}">${label}</option>`;
    }
  }
  return `<select id="${id}">${options}</select>`;
}
 
function toggleAddForm(dateStr) {
  document.getElementById(`form-${dateStr}`).classList.toggle('open');
}
 
function toggleOpenForm(dateStr) {
  document.getElementById(`open-form-${dateStr}`).classList.toggle('open');
}
 
async function saveOpenTime(dateStr) {
  const start_time = document.getElementById(`open-start-${dateStr}`).value;
  const end_time = document.getElementById(`open-end-${dateStr}`).value;
  const label = document.getElementById(`open-label-${dateStr}`).value.trim() || (isZh() ? '可预约' : 'Available');
  const errorEl = document.getElementById(`open-error-${dateStr}`);
  errorEl.textContent = '';
 
  try {
    const res = await fetch(`${API_BASE}/api/admin/open-time`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Passcode': passcode },
      body: JSON.stringify({ date: dateStr, start_time, end_time, label }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || (isZh() ? '保存失败。' : 'Failed to save.');
      return;
    }
    loadDay(dateStr);
  } catch (err) {
    errorEl.textContent = isZh() ? '网络错误。' : 'Network error.';
  }
}
 
async function saveBlock(dateStr) {
  const start_time = document.getElementById(`start-${dateStr}`).value;
  const end_time = document.getElementById(`end-${dateStr}`).value;
  const label = document.getElementById(`label-${dateStr}`).value.trim() || (isZh() ? '不可预约' : 'Blocked');
  const errorEl = document.getElementById(`error-${dateStr}`);
  errorEl.textContent = '';
 
  try {
    const res = await fetch(`${API_BASE}/api/admin/block`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Passcode': passcode },
      body: JSON.stringify({ date: dateStr, start_time, end_time, label }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || (isZh() ? '保存失败。' : 'Failed to save.');
      return;
    }
    loadDay(dateStr);
  } catch (err) {
    errorEl.textContent = isZh() ? '网络错误。' : 'Network error.';
  }
}
 
async function deleteBlock(eventId, dateStr) {
  try {
    const res = await fetch(`${API_BASE}/api/admin/block/${eventId}?date=${dateStr}`, {
      method: 'DELETE',
      headers: { 'X-Admin-Passcode': passcode },
    });
    if (!res.ok) {
      const data = await res.json();
      alert(data.error || (isZh() ? '删除失败。' : 'Failed to delete.'));
      return;
    }
    loadDay(dateStr);
  } catch (err) {
    alert(isZh() ? '网络错误。' : 'Network error.');
  }
}
 
function toggleRescheduleForm(eventId) {
  document.getElementById(`reschedule-${eventId}`).classList.toggle('open');
}
 
async function saveReschedule(eventId, originalDate) {
  const new_date = document.getElementById(`reschedule-date-${eventId}`).value;
  const start_time = document.getElementById(`reschedule-start-${eventId}`).value;
  const end_time = document.getElementById(`reschedule-end-${eventId}`).value;
  const errorEl = document.getElementById(`reschedule-error-${eventId}`);
  errorEl.textContent = '';
 
  try {
    const res = await fetch(`${API_BASE}/api/admin/appointment/${eventId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Passcode': passcode },
      body: JSON.stringify({ original_date: originalDate, new_date, start_time, end_time }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || (isZh() ? '改期失败。' : 'Failed to reschedule.');
      return;
    }
    loadDay(originalDate);
    if (new_date !== originalDate) loadDay(new_date);
  } catch (err) {
    errorEl.textContent = isZh() ? '网络错误。' : 'Network error.';
  }
}
 
async function cancelAppointment(eventId, dateStr) {
  const confirmMsg = isZh() ? '确定要取消此预约吗？患者将收到通知。' : 'Cancel this appointment? The patient will be notified.';
  if (!confirm(confirmMsg)) return;
 
  try {
    const res = await fetch(`${API_BASE}/api/admin/appointment/${eventId}?date=${dateStr}`, {
      method: 'DELETE',
      headers: { 'X-Admin-Passcode': passcode },
    });
    if (!res.ok) {
      const data = await res.json();
      alert(data.error || (isZh() ? '取消失败。' : 'Failed to cancel.'));
      return;
    }
    loadDay(dateStr);
  } catch (err) {
    alert(isZh() ? '网络错误。' : 'Network error.');
  }
}
</script>
